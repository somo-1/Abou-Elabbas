<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>إنشاء حساب | EDU CENTER</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase-config.js"></script>


    <style>

        :root {
            --gold: #d8b45a;
            --gold-light: #f0d98b;
            --black: #050505;
            --card: rgba(18, 18, 18, 0.78);
            --border: rgba(216, 180, 90, 0.22);
            --text: #f5f5f5;
            --muted: #a7a7a7;
            --danger: #ff6b6b;
            --success: #71d99b;
        }


        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {
            min-height: 100vh;

            font-family: "Cairo", sans-serif;

            background:
                radial-gradient(
                    circle at top right,
                    rgba(216, 180, 90, 0.08),
                    transparent 35%
                ),
                radial-gradient(
                    circle at bottom left,
                    rgba(216, 180, 90, 0.05),
                    transparent 35%
                ),
                var(--black);

            color: var(--text);

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 25px;
        }


        .auth-container {
            width: 100%;
            max-width: 470px;
        }


        .logo {
            display: flex;

            justify-content: center;

            margin-bottom: 25px;
        }


        .logo img {
            width: 85px;
            height: 85px;

            object-fit: contain;

            border-radius: 50%;
        }


        .auth-card {
            background: var(--card);

            border:
                1px solid
                var(--border);

            border-radius: 24px;

            padding: 38px 32px;

            box-shadow:
                0 25px 70px
                rgba(0, 0, 0, 0.45);

            backdrop-filter: blur(18px);
        }


        h1 {
            text-align: center;

            font-size: 28px;

            margin-bottom: 8px;
        }


        .subtitle {
            text-align: center;

            color: var(--muted);

            font-size: 14px;

            margin-bottom: 30px;
        }


        .form-group {
            margin-bottom: 18px;
        }


        label {
            display: block;

            margin-bottom: 8px;

            font-size: 14px;

            color: #ddd;
        }


        input {
            width: 100%;

            padding: 14px 16px;

            border-radius: 12px;

            border:
                1px solid
                rgba(255, 255, 255, 0.1);

            background:
                rgba(255, 255, 255, 0.045);

            color: white;

            font-family: inherit;

            outline: none;

            transition: 0.25s;
        }


        input:focus {
            border-color: var(--gold);

            box-shadow:
                0 0 0 3px
                rgba(216, 180, 90, 0.08);
        }


        input::placeholder {
            color: #777;
        }


        .password-note {
            color: #777;

            font-size: 12px;

            margin-top: 6px;
        }


        button {
            width: 100%;

            border: none;

            border-radius: 12px;

            padding: 14px;

            margin-top: 8px;

            background:
                linear-gradient(
                    135deg,
                    var(--gold-light),
                    var(--gold)
                );

            color: #111;

            font-family: inherit;

            font-size: 16px;

            font-weight: 800;

            cursor: pointer;

            transition: 0.25s;
        }


        button:hover {
            transform: translateY(-2px);

            box-shadow:
                0 10px 30px
                rgba(216, 180, 90, 0.18);
        }


        button:disabled {
            opacity: 0.6;

            cursor: not-allowed;

            transform: none;
        }


        .message {
            display: none;

            margin-top: 18px;

            padding: 13px 15px;

            border-radius: 12px;

            font-size: 13px;

            line-height: 1.7;

            text-align: center;
        }


        .message.success {
            display: block;

            color: var(--success);

            background:
                rgba(113, 217, 155, 0.08);

            border:
                1px solid
                rgba(113, 217, 155, 0.18);
        }


        .message.error {
            display: block;

            color: var(--danger);

            background:
                rgba(255, 107, 107, 0.08);

            border:
                1px solid
                rgba(255, 107, 107, 0.18);
        }


        .bottom-text {
            text-align: center;

            margin-top: 24px;

            color: var(--muted);

            font-size: 14px;
        }


        .bottom-text a {
            color: var(--gold-light);

            text-decoration: none;

            font-weight: 700;
        }


        .bottom-text a:hover {
            text-decoration: underline;
        }


        .back-home {
            display: block;

            text-align: center;

            margin-top: 18px;

            color: #777;

            text-decoration: none;

            font-size: 13px;

            transition: 0.2s;
        }


        .back-home:hover {
            color: var(--gold-light);
        }


        @media (max-width: 500px) {

            body {
                padding: 15px;
            }


            .auth-card {
                padding: 30px 20px;
            }


            h1 {
                font-size: 24px;
            }

        }

    </style>

</head>


<body>

    <main class="auth-container">

        <div class="logo">

            <img
                src="logo.png"
                alt="شعار EDU CENTER"
            >

        </div>


        <section class="auth-card">

            <h1>
                إنشاء حساب
            </h1>


            <p class="subtitle">
                أنشئ حسابك في EDU CENTER وابدأ الآن
            </p>


            <form id="registerForm">


                <div class="form-group">

                    <label for="fullName">
                        الاسم بالكامل
                    </label>


                    <input
                        type="text"
                        id="fullName"
                        placeholder="اكتب اسمك بالكامل"
                        required
                        autocomplete="name"
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        البريد الإلكتروني
                    </label>


                    <input
                        type="email"
                        id="email"
                        placeholder="example@gmail.com"
                        required
                        autocomplete="email"
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        كلمة المرور
                    </label>


                    <input
                        type="password"
                        id="password"
                        placeholder="••••••••"
                        required
                        minlength="6"
                        autocomplete="new-password"
                    >


                    <div class="password-note">
                        يجب أن تكون كلمة المرور 6 أحرف على الأقل.
                    </div>

                </div>


                <div class="form-group">

                    <label for="confirmPassword">
                        تأكيد كلمة المرور
                    </label>


                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="أعد كتابة كلمة المرور"
                        required
                        autocomplete="new-password"
                    >

                </div>


                <button
                    type="submit"
                    id="registerButton"
                >
                    إنشاء الحساب
                </button>


            </form>


            <div
                id="message"
                class="message"
            ></div>


            <div class="bottom-text">

                لديك حساب بالفعل؟

                <a href="login.html">
                    تسجيل الدخول
                </a>

            </div>


            <a
                href="index.html"
                class="back-home"
            >
                ← العودة إلى الموقع
            </a>


        </section>

    </main>


    <script>

        const registerForm =
            document.getElementById(
                "registerForm"
            );


        const registerButton =
            document.getElementById(
                "registerButton"
            );


        const message =
            document.getElementById(
                "message"
            );


        function showMessage(
            text,
            type
        ) {

            message.textContent =
                text;

            message.className =
                "message " + type;

        }


        registerForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                const fullName =
                    document
                        .getElementById("fullName")
                        .value
                        .trim();


                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim();


                const password =
                    document
                        .getElementById("password")
                        .value;


                const confirmPassword =
                    document
                        .getElementById("confirmPassword")
                        .value;


                if (!fullName) {

                    showMessage(
                        "اكتب اسمك بالكامل.",
                        "error"
                    );

                    return;
                }


                if (password.length < 6) {

                    showMessage(
                        "كلمة المرور يجب أن تكون 6 أحرف على الأقل.",
                        "error"
                    );

                    return;
                }


                if (
                    password !==
                    confirmPassword
                ) {

                    showMessage(
                        "كلمتا المرور غير متطابقتين.",
                        "error"
                    );

                    return;
                }


                registerButton.disabled =
                    true;


                registerButton.textContent =
                    "جاري إنشاء الحساب...";


                try {

                    const redirectUrl =
                        window.location.origin +
                        "/index.html";


                    const {
                        data,
                        error
                    } =
                        await supabaseClient
                            .auth
                            .signUp({

                                email:
                                    email,

                                password:
                                    password,

                                options: {

                                    emailRedirectTo:
                                        redirectUrl,

                                    data: {

                                        full_name:
                                            fullName

                                    }

                                }

                            });


                    if (error) {
                        throw error;
                    }


                    showMessage(
                        "تم إنشاء الحساب بنجاح. افتح Gmail واضغط على رابط تأكيد البريد الإلكتروني.",
                        "success"
                    );


                    registerForm.reset();


                } catch (error) {

                    console.error(
                        "REGISTER ERROR:",
                        error
                    );


                    let errorMessage =
                        error.message ||
                        "حدث خطأ أثناء إنشاء الحساب.";


                    if (
                        errorMessage
                            .toLowerCase()
                            .includes(
                                "user already registered"
                            )
                    ) {

                        errorMessage =
                            "هذا البريد الإلكتروني مسجل بالفعل.";

                    }


                    showMessage(
                        errorMessage,
                        "error"
                    );


                } finally {

                    registerButton.disabled =
                        false;


                    registerButton.textContent =
                        "إنشاء الحساب";

                }

            }
        );

    </script>

</body>

</html>
