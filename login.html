<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>تسجيل الدخول | EDU CENTER</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Supabase Config -->
    <script src="supabase-config.js"></script>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            font-family: "Cairo", Arial, sans-serif;

            background:
                radial-gradient(
                    circle at top right,
                    rgba(216, 180, 90, 0.08),
                    transparent 35%
                ),
                #050505;

            color: #f5f5f5;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 30px 20px;

        }


        .login-container {

            width: 100%;

            max-width: 480px;

        }


        .login-card {

            background: rgba(15, 15, 15, 0.94);

            border: 1px solid rgba(216, 180, 90, 0.14);

            border-radius: 24px;

            padding: 38px 34px;

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.55),
                inset 0 1px 0 rgba(255, 255, 255, 0.02);

            backdrop-filter: blur(15px);

        }


        /* ==========================================
           اللوجو
        ========================================== */

        .brand {

            text-align: center;

            margin-bottom: 30px;

        }


        .brand-logo {

            width: 88px;

            height: 88px;

            margin: 0 auto 18px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 22px;

            background: rgba(216, 180, 90, 0.05);

            border: 1px solid rgba(216, 180, 90, 0.14);

            padding: 10px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.25);

        }


        .brand-logo img {

            width: 100%;

            height: 100%;

            object-fit: contain;

            display: block;

        }


        .brand h1 {

            font-size: 27px;

            margin-bottom: 7px;

            line-height: 1.5;

        }


        .brand h1 span {

            color: #d8b45a;

        }


        .brand p {

            color: #999;

            font-size: 14px;

            line-height: 1.8;

        }


        .form-group {

            margin-bottom: 18px;

        }


        .form-group label {

            display: block;

            margin-bottom: 8px;

            color: #ddd;

            font-size: 14px;

            font-weight: 600;

        }


        .form-group input {

            width: 100%;

            height: 52px;

            padding: 0 16px;

            border-radius: 13px;

            border: 1px solid rgba(255, 255, 255, 0.09);

            background: #0b0b0b;

            color: #fff;

            font-family: inherit;

            font-size: 14px;

            outline: none;

            transition: 0.25s;

        }


        .form-group input:focus {

            border-color: rgba(216, 180, 90, 0.6);

            box-shadow:
                0 0 0 3px rgba(216, 180, 90, 0.07);

        }


        .form-group input::placeholder {

            color: #666;

        }


        .password-wrapper {

            position: relative;

        }


        .password-wrapper input {

            padding-left: 70px;

        }


        .password-toggle {

            position: absolute;

            left: 14px;

            top: 50%;

            transform: translateY(-50%);

            border: none;

            background: transparent;

            color: #888;

            cursor: pointer;

            font-family: inherit;

            font-size: 12px;

        }


        .password-toggle:hover {

            color: #d8b45a;

        }


        .login-options {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 10px;

            margin: 5px 0 22px;

        }


        .remember {

            display: flex;

            align-items: center;

            gap: 7px;

            color: #888;

            font-size: 12px;

            cursor: pointer;

        }


        .remember input {

            accent-color: #d8b45a;

            cursor: pointer;

        }


        .forgot-password {

            border: none;

            background: transparent;

            color: #d8b45a;

            font-family: inherit;

            font-size: 12px;

            cursor: pointer;

        }


        .forgot-password:hover {

            text-decoration: underline;

        }


        .login-button {

            width: 100%;

            height: 53px;

            border: none;

            border-radius: 13px;

            background: linear-gradient(
                135deg,
                #d8b45a,
                #b9923e
            );

            color: #080808;

            font-family: inherit;

            font-size: 15px;

            font-weight: 800;

            cursor: pointer;

            transition: 0.25s;

            box-shadow:
                0 10px 30px rgba(216, 180, 90, 0.12);

        }


        .login-button:hover {

            transform: translateY(-2px);

            box-shadow:
                0 14px 35px rgba(216, 180, 90, 0.2);

        }


        .login-button:disabled {

            opacity: 0.6;

            cursor: not-allowed;

            transform: none;

        }


        .message {

            display: none;

            margin-top: 15px;

            padding: 13px 14px;

            border-radius: 12px;

            text-align: center;

            font-size: 13px;

            line-height: 1.7;

        }


        .message.success {

            display: block;

            background: rgba(75, 180, 110, 0.08);

            border: 1px solid rgba(75, 180, 110, 0.2);

            color: #7ddf9b;

        }


        .message.error {

            display: block;

            background: rgba(220, 70, 70, 0.08);

            border: 1px solid rgba(220, 70, 70, 0.2);

            color: #ff8585;

        }


        .register-link {

            text-align: center;

            margin-top: 24px;

            color: #888;

            font-size: 13px;

        }


        .register-link a {

            color: #d8b45a;

            text-decoration: none;

            font-weight: 700;

        }


        .register-link a:hover {

            text-decoration: underline;

        }


        .back-home {

            display: block;

            text-align: center;

            margin-top: 18px;

            color: #666;

            text-decoration: none;

            font-size: 12px;

            transition: 0.2s;

        }


        .back-home:hover {

            color: #d8b45a;

        }


        @media (max-width: 520px) {

            body {

                padding: 20px 14px;

            }


            .login-card {

                padding: 30px 22px;

                border-radius: 20px;

            }


            .brand-logo {

                width: 76px;

                height: 76px;

            }


            .brand h1 {

                font-size: 24px;

            }

        }

    </style>

</head>


<body>


    <main class="login-container">

        <section class="login-card">


            <!-- ==========================================
                 البراند واللوجو
            ========================================== -->

            <div class="brand">

                <div class="brand-logo">

                    <img
                        src="logo.png"
                        alt="شعار EDU CENTER"
                    >

                </div>


                <h1>

                    تسجيل الدخول إلى

                    <span>EDU CENTER</span>

                </h1>


                <p>

                    سجل دخولك للوصول إلى حسابك

                </p>

            </div>


            <form id="loginForm">


                <!-- البريد الإلكتروني -->

                <div class="form-group">

                    <label for="email">

                        البريد الإلكتروني

                    </label>


                    <input
                        type="email"
                        id="email"
                        placeholder="example@email.com"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- كلمة المرور -->

                <div class="form-group">

                    <label for="password">

                        كلمة المرور

                    </label>


                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="password"
                            placeholder="أدخل كلمة المرور"
                            autocomplete="current-password"
                            required
                        >


                        <button
                            type="button"
                            class="password-toggle"
                            id="togglePassword"
                        >

                            إظهار

                        </button>

                    </div>

                </div>


                <!-- الخيارات -->

                <div class="login-options">


                    <label class="remember">

                        <input
                            type="checkbox"
                            id="remember"
                        >

                        تذكرني

                    </label>


                    <button
                        type="button"
                        class="forgot-password"
                        id="forgotPassword"
                    >

                        نسيت كلمة المرور؟

                    </button>


                </div>


                <!-- تسجيل الدخول -->

                <button
                    type="submit"
                    class="login-button"
                    id="loginButton"
                >

                    تسجيل الدخول

                </button>


                <!-- الرسالة -->

                <div
                    id="message"
                    class="message"
                ></div>


            </form>


            <div class="register-link">

                ليس لديك حساب؟

                <a href="register.html">

                    إنشاء حساب جديد

                </a>

            </div>


            <a
                href="index.html"
                class="back-home"
            >

                ← العودة إلى الصفحة الرئيسية

            </a>


        </section>

    </main>


    <script>


        // ==========================================
        // العناصر
        // ==========================================

        const loginForm =
            document.getElementById("loginForm");


        const emailInput =
            document.getElementById("email");


        const passwordInput =
            document.getElementById("password");


        const rememberInput =
            document.getElementById("remember");


        const loginButton =
            document.getElementById("loginButton");


        const message =
            document.getElementById("message");


        const togglePassword =
            document.getElementById("togglePassword");


        const forgotPassword =
            document.getElementById("forgotPassword");


        // ==========================================
        // إظهار / إخفاء كلمة المرور
        // ==========================================

        togglePassword.addEventListener(
            "click",
            function () {

                if (passwordInput.type === "password") {

                    passwordInput.type = "text";

                    togglePassword.textContent =
                        "إخفاء";

                } else {

                    passwordInput.type = "password";

                    togglePassword.textContent =
                        "إظهار";

                }

            }
        );


        // ==========================================
        // عرض الرسائل
        // ==========================================

        function showMessage(text, type) {

            message.textContent = text;

            message.className =
                "message " + type;

        }


        // ==========================================
        // تسجيل الدخول
        // ==========================================

        loginForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                const email =
                    emailInput.value.trim();


                const password =
                    passwordInput.value;


                if (!email || !password) {

                    showMessage(
                        "اكتب البريد الإلكتروني وكلمة المرور.",
                        "error"
                    );

                    return;

                }


                // التأكد من وجود Supabase

                if (
                    typeof supabaseClient === "undefined"
                ) {

                    showMessage(
                        "تعذر الاتصال بنظام الحسابات. تأكد من ملف supabase-config.js.",
                        "error"
                    );

                    return;

                }


                // تعطيل الزر

                loginButton.disabled = true;

                loginButton.textContent =
                    "جاري تسجيل الدخول...";


                try {


                    // ==========================================
                    // تسجيل الدخول من Supabase
                    // ==========================================

                    const {
                        data,
                        error
                    } = await supabaseClient.auth.signInWithPassword({

                        email: email,

                        password: password

                    });


                    // ==========================================
                    // الخطأ
                    // ==========================================

                    if (error) {

                        console.error(
                            "Supabase Login Error:",
                            error
                        );


                        showMessage(
                            "البريد الإلكتروني أو كلمة المرور غير صحيحة.",
                            "error"
                        );


                        loginButton.disabled = false;

                        loginButton.textContent =
                            "تسجيل الدخول";


                        return;

                    }


                    // ==========================================
                    // نجاح تسجيل الدخول
                    // ==========================================

                    console.log(
                        "Logged In User:",
                        data.user
                    );


                    showMessage(
                        "تم تسجيل الدخول بنجاح.",
                        "success"
                    );


                    loginButton.textContent =
                        "تم تسجيل الدخول";


                    // ==========================================
                    // الانتقال بعد تسجيل الدخول
                    // ==========================================

                    setTimeout(function () {

                        window.location.href =
                            "index.html";

                    }, 1000);


                } catch (error) {


                    console.error(
                        "Unexpected Login Error:",
                        error
                    );


                    showMessage(
                        "حدث خطأ غير متوقع. حاول مرة أخرى.",
                        "error"
                    );


                    loginButton.disabled = false;

                    loginButton.textContent =
                        "تسجيل الدخول";

                }

            }
        );


        // ==========================================
        // نسيت كلمة المرور
        // ==========================================

        forgotPassword.addEventListener(
            "click",
            async function () {


                const email =
                    emailInput.value.trim();


                if (!email) {

                    showMessage(
                        "اكتب بريدك الإلكتروني أولًا ثم اضغط على نسيت كلمة المرور.",
                        "error"
                    );

                    emailInput.focus();

                    return;

                }


                if (
                    typeof supabaseClient === "undefined"
                ) {

                    showMessage(
                        "تعذر الاتصال بنظام الحسابات.",
                        "error"
                    );

                    return;

                }


                forgotPassword.disabled = true;

                forgotPassword.textContent =
                    "جاري الإرسال...";


                try {


                    const {
                        error
                    } =
                        await supabaseClient.auth.resetPasswordForEmail(
                            email,
                            {
                                redirectTo:
                                    window.location.origin +
                                    "/reset-password.html"
                            }
                        );


                    if (error) {

                        console.error(
                            "Password Reset Error:",
                            error
                        );


                        showMessage(
                            error.message ||
                            "تعذر إرسال رسالة إعادة تعيين كلمة المرور.",
                            "error"
                        );


                    } else {

                        showMessage(
                            "تم إرسال رابط إعادة تعيين كلمة المرور إلى بريدك الإلكتروني إذا كان الحساب موجودًا.",
                            "success"
                        );

                    }


                } catch (error) {

                    console.error(
                        "Unexpected Reset Error:",
                        error
                    );


                    showMessage(
                        "حدث خطأ أثناء إرسال رسالة إعادة تعيين كلمة المرور.",
                        "error"
                    );

                }


                forgotPassword.disabled = false;

                forgotPassword.textContent =
                    "نسيت كلمة المرور؟";

            }
        );


    </script>


</body>

</html>
