<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>تغيير كلمة المرور | EDU CENTER</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Supabase Config -->
    <script src="supabase-config.js"></script>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            font-family: "Cairo", Arial, sans-serif;

            background:
                radial-gradient(
                    circle at top right,
                    rgba(216, 180, 90, 0.10),
                    transparent 35%
                ),
                #050505;

            color: white;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;

        }


        .container {

            width: 100%;

            max-width: 500px;

        }


        .card {

            width: 100%;

            background: rgba(15, 15, 15, 0.95);

            border: 1px solid rgba(216, 180, 90, 0.15);

            border-radius: 25px;

            padding: 40px 30px;

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.6);

            backdrop-filter: blur(15px);

        }


        /* ==========================================
           اللوجو
        ========================================== */

        .logo {

            width: 88px;

            height: 88px;

            margin: 0 auto 20px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 22px;

            background: rgba(216, 180, 90, 0.05);

            border: 1px solid rgba(216, 180, 90, 0.14);

            padding: 10px;

        }


        .logo img {

            width: 100%;

            height: 100%;

            object-fit: contain;

        }


        /* ==========================================
           العنوان
        ========================================== */

        .header {

            text-align: center;

            margin-bottom: 30px;

        }


        .header h1 {

            font-size: 27px;

            margin-bottom: 8px;

        }


        .header h1 span {

            color: #d8b45a;

        }


        .header p {

            color: #999;

            font-size: 14px;

            line-height: 1.8;

        }


        /* ==========================================
           الحقول
        ========================================== */

        .form-group {

            margin-bottom: 20px;

        }


        .form-group label {

            display: block;

            color: #ddd;

            font-size: 14px;

            font-weight: 700;

            margin-bottom: 8px;

        }


        .password-wrapper {

            position: relative;

        }


        .password-wrapper input {

            padding-left: 75px;

        }


        input {

            width: 100%;

            height: 52px;

            background: #080808;

            border: 1px solid rgba(255, 255, 255, 0.10);

            border-radius: 13px;

            color: white;

            font-family: inherit;

            font-size: 14px;

            padding: 0 16px;

            outline: none;

            transition: 0.25s;

        }


        input::placeholder {

            color: #666;

        }


        input:focus {

            border-color: rgba(216, 180, 90, 0.60);

            box-shadow:
                0 0 0 3px rgba(216, 180, 90, 0.08);

        }


        .password-toggle {

            position: absolute;

            left: 10px;

            top: 50%;

            transform: translateY(-50%);

            border: none;

            background: transparent;

            color: #d8b45a;

            font-family: inherit;

            font-size: 12px;

            font-weight: 700;

            cursor: pointer;

            padding: 6px;

        }


        /* ==========================================
           زر الحفظ
        ========================================== */

        .save-button {

            width: 100%;

            height: 52px;

            border: none;

            border-radius: 13px;

            background:
                linear-gradient(
                    135deg,
                    #d8b45a,
                    #b9923e
                );

            color: #080808;

            font-family: inherit;

            font-weight: 800;

            font-size: 14px;

            cursor: pointer;

            margin-top: 5px;

            transition: 0.25s;

            box-shadow:
                0 10px 30px rgba(216, 180, 90, 0.10);

        }


        .save-button:hover {

            transform: translateY(-2px);

            box-shadow:
                0 14px 35px rgba(216, 180, 90, 0.18);

        }


        .save-button:disabled {

            opacity: 0.6;

            cursor: not-allowed;

            transform: none;

        }


        /* ==========================================
           الرسائل
        ========================================== */

        .message {

            min-height: 24px;

            margin-top: 18px;

            text-align: center;

            font-size: 13px;

            line-height: 1.7;

        }


        .message.success {

            color: #72d572;

        }


        .message.error {

            color: #ff7777;

        }


        .message.info {

            color: #d8b45a;

        }


        /* ==========================================
           العودة
        ========================================== */

        .back {

            display: block;

            margin-top: 22px;

            text-align: center;

            color: #777;

            text-decoration: none;

            font-size: 13px;

            transition: 0.2s;

        }


        .back:hover {

            color: #d8b45a;

        }


        /* ==========================================
           الموبايل
        ========================================== */

        @media (max-width: 500px) {

            body {

                padding: 14px;

            }


            .card {

                padding: 30px 20px;

                border-radius: 20px;

            }


            .logo {

                width: 76px;

                height: 76px;

            }


            .header h1 {

                font-size: 24px;

            }

        }

    </style>

</head>


<body>


    <main class="container">

        <section class="card">


            <!-- ==========================================
                 اللوجو
            ========================================== -->

            <div class="logo">

                <img
                    src="logo.png"
                    alt="شعار EDU CENTER"
                >

            </div>


            <!-- ==========================================
                 العنوان
            ========================================== -->

            <div class="header">

                <h1>
                    تغيير كلمة المرور
                    <span>EDU CENTER</span>
                </h1>

                <p>
                    أدخل كلمة المرور الجديدة لحسابك
                </p>

            </div>


            <!-- ==========================================
                 النموذج
            ========================================== -->

            <form id="resetForm">


                <!-- كلمة المرور الجديدة -->

                <div class="form-group">

                    <label for="password">
                        كلمة المرور الجديدة
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="password"
                            placeholder="أدخل كلمة المرور الجديدة"
                            autocomplete="new-password"
                            minlength="6"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            id="togglePassword"
                        >
                            إظهار
                        </button>

                    </div>

                </div>


                <!-- تأكيد كلمة المرور -->

                <div class="form-group">

                    <label for="confirmPassword">
                        تأكيد كلمة المرور
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="أعد كتابة كلمة المرور"
                            autocomplete="new-password"
                            minlength="6"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            id="toggleConfirmPassword"
                        >
                            إظهار
                        </button>

                    </div>

                </div>


                <button
                    type="submit"
                    class="save-button"
                    id="saveButton"
                >
                    حفظ كلمة المرور
                </button>


                <div
                    class="message"
                    id="message"
                ></div>


            </form>


            <a
                href="login.html"
                class="back"
            >
                ← العودة إلى تسجيل الدخول
            </a>


        </section>

    </main>


    <script>

        // ==========================================
        // العناصر
        // ==========================================

        const resetForm =
            document.getElementById("resetForm");

        const passwordInput =
            document.getElementById("password");

        const confirmPasswordInput =
            document.getElementById("confirmPassword");

        const togglePassword =
            document.getElementById("togglePassword");

        const toggleConfirmPassword =
            document.getElementById("toggleConfirmPassword");

        const saveButton =
            document.getElementById("saveButton");

        const message =
            document.getElementById("message");


        // ==========================================
        // عرض الرسالة
        // ==========================================

        function showMessage(text, type) {

            message.textContent = text;

            message.className =
                "message " + type;

        }


        // ==========================================
        // إظهار / إخفاء كلمة المرور
        // ==========================================

        togglePassword.addEventListener(
            "click",
            function () {

                if (
                    passwordInput.type ===
                    "password"
                ) {

                    passwordInput.type =
                        "text";

                    togglePassword.textContent =
                        "إخفاء";

                } else {

                    passwordInput.type =
                        "password";

                    togglePassword.textContent =
                        "إظهار";

                }

            }
        );


        toggleConfirmPassword.addEventListener(
            "click",
            function () {

                if (
                    confirmPasswordInput.type ===
                    "password"
                ) {

                    confirmPasswordInput.type =
                        "text";

                    toggleConfirmPassword.textContent =
                        "إخفاء";

                } else {

                    confirmPasswordInput.type =
                        "password";

                    toggleConfirmPassword.textContent =
                        "إظهار";

                }

            }
        );


        // ==========================================
        // التعامل مع رابط Supabase
        // ==========================================

        async function handleRecoveryCode() {

            try {

                const url =
                    new URL(
                        window.location.href
                    );

                const code =
                    url.searchParams.get(
                        "code"
                    );


                // لو يوجد code في الرابط
                if (code) {

                    showMessage(
                        "جاري تجهيز صفحة تغيير كلمة المرور...",
                        "info"
                    );


                    const {
                        error
                    } =
                        await supabaseClient
                            .auth
                            .exchangeCodeForSession(
                                code
                            );


                    if (error) {

                        console.error(
                            "Recovery Code Error:",
                            error
                        );

                        showMessage(
                            "رابط إعادة تعيين كلمة المرور غير صالح أو انتهت صلاحيته.",
                            "error"
                        );

                        return;

                    }


                    // تنظيف الرابط
                    window.history.replaceState(
                        null,
                        document.title,
                        window.location.origin +
                        window.location.pathname
                    );


                    showMessage(
                        "يمكنك الآن اختيار كلمة مرور جديدة.",
                        "info"
                    );

                    return;

                }


                // ==================================
                // التأكد من وجود جلسة
                // ==================================

                const {
                    data,
                    error
                } =
                    await supabaseClient
                        .auth
                        .getSession();


                if (
                    error ||
                    !data ||
                    !data.session
                ) {

                    showMessage(
                        "افتح الصفحة من رابط إعادة تعيين كلمة المرور الذي وصلك على بريدك الإلكتروني.",
                        "error"
                    );

                    saveButton.disabled =
                        true;

                }

            } catch (error) {

                console.error(
                    "Recovery Error:",
                    error
                );

                showMessage(
                    "حدث خطأ أثناء تجهيز صفحة تغيير كلمة المرور.",
                    "error"
                );

            }

        }


        // ==========================================
        // حفظ كلمة المرور الجديدة
        // ==========================================

        resetForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                const password =
                    passwordInput.value;

                const confirmPassword =
                    confirmPasswordInput.value;


                // ==================================
                // التحقق
                // ==================================

                if (
                    password.length < 6
                ) {

                    showMessage(
                        "كلمة المرور يجب أن تكون 6 أحرف أو أكثر.",
                        "error"
                    );

                    return;

                }


                if (
                    password !==
                    confirmPassword
                ) {

                    showMessage(
                        "كلمتا المرور غير متطابقتين.",
                        "error"
                    );

                    return;

                }


                saveButton.disabled =
                    true;

                saveButton.textContent =
                    "جاري الحفظ...";


                try {

                    const {
                        data: sessionData,
                        error: sessionError
                    } =
                        await supabaseClient
                            .auth
                            .getSession();


                    if (
                        sessionError ||
                        !sessionData ||
                        !sessionData.session
                    ) {

                        showMessage(
                            "انتهت صلاحية رابط إعادة التعيين. اطلب رابطًا جديدًا.",
                            "error"
                        );

                        saveButton.disabled =
                            false;

                        saveButton.textContent =
                            "حفظ كلمة المرور";

                        return;

                    }


                    // ==================================
                    // تحديث كلمة المرور
                    // ==================================

                    const {
                        error
                    } =
                        await supabaseClient
                            .auth
                            .updateUser({

                                password:
                                    password

                            });


                    if (error) {

                        console.error(
                            "Update Password Error:",
                            error
                        );

                        showMessage(
                            error.message ||
                            "تعذر تغيير كلمة المرور.",
                            "error"
                        );

                        saveButton.disabled =
                            false;

                        saveButton.textContent =
                            "حفظ كلمة المرور";

                        return;

                    }


                    // ==================================
                    // نجاح
                    // ==================================

                    showMessage(
                        "تم تغيير كلمة المرور بنجاح ✓",
                        "success"
                    );

                    saveButton.textContent =
                        "تم الحفظ ✓";


                    passwordInput.value =
                        "";

                    confirmPasswordInput.value =
                        "";


                    // ==================================
                    // العودة لتسجيل الدخول
                    // ==================================

                    setTimeout(
                        async function () {

                            await supabaseClient
                                .auth
                                .signOut();

                            window.location.href =
                                "login.html";

                        },
                        1800
                    );


                } catch (error) {

                    console.error(
                        "Unexpected Password Error:",
                        error
                    );

                    showMessage(
                        "حدث خطأ غير متوقع. حاول مرة أخرى.",
                        "error"
                    );

                    saveButton.disabled =
                        false;

                    saveButton.textContent =
                        "حفظ كلمة المرور";

                }

            }
        );


        // ==========================================
        // تشغيل الصفحة
        // ==========================================

        handleRecoveryCode();

    </script>

</body>

</html>
